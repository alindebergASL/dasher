name: ci

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static gates only. Split from `verify` so a formatting, lint, or type error
  # reports in roughly two minutes instead of behind the build and browser
  # suites. Runs in parallel with `verify`, not before it.
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: "grep -qx 'Status: CLOSED' docs/security/GENERATED_CODE_GATE.md"

      - run: test -z "$(git status --porcelain)"

  # Mutation testing for the reachable product logic: the planner and the river
  # composition rules it shares with river-domain. Its own job so a ~100s run
  # does not sit in front of the static gates; it is a gate rather than a report
  # because a test suite that stops discriminating is exactly the failure it
  # exists to name, and one nobody runs finds nothing.
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:mutation

      # Stryker mutates in place and restores afterwards. If a crash ever left
      # a mutant behind, this reports it rather than letting the next step run
      # against altered source. `always()` because the crash case is exactly
      # when the run fails, and a residue check that only runs on success
      # cannot diagnose the failure it exists for.
      - if: always()
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm build

      - id: playwright-version
        run: |
          version="$(node -p "require('./apps/web/package.json').devDependencies['@playwright/test']")"
          echo "version=${version}" >>"$GITHUB_OUTPUT"

      # The browser download is the expensive half of `install --with-deps` and
      # only changes when @playwright/test changes, so it is cached on that
      # exact pinned version. The apt half is not cacheable and still runs.
      - id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # The apt half of this is not cacheable and reaches a distribution mirror
      # on every run. On 2026-08-19 that mirror went silent mid-`apt-get
      # update`: the step held the runner for 29m37s, was cancelled by the job
      # timeout, and not one product test ran. The retry still took 3m40s
      # against a step that normally finishes in seconds, so the mirror was
      # degraded rather than dead — intermittent, not a one-off.
      #
      # An unbounded network step inside a bounded job spends the whole job
      # budget on its own worst case, reports it as a job timeout that reads
      # like a product failure, and withholds the log until the very end,
      # because a running job's logs cannot be fetched. Two bounded attempts
      # cost at most eighteen minutes, recovery included, and leave the outer
      # 30-minute ceiling as a backstop rather than as the mechanism.
      #
      # The two bounds are deliberately asymmetric: SHORT first, GENEROUS retry.
      #
      # A first attempt bounded near the healthy case detects a stuck mirror
      # early instead of paying for it. But the retry must not inherit that
      # bound, and CI proved why: a later run took 9m51s in this step and
      # SUCCEEDED. Two five-minute attempts — the first version of this file —
      # would have timed out twice against a mirror that was working and turned
      # a slow green run red. A policy that fails on evidence already in hand is
      # worse than the unbounded step it replaces.
      #
      # So: 4 minutes to notice, 2 to clear the wreckage, 12 to actually
      # finish. Worst case 18 minutes, comfortably inside the 30-minute
      # ceiling that still backstops the job, and better failure behaviour
      # than two 8-minute attempts because the decision to retry arrives
      # sooner.
      #
      # The first attempt may fail without failing the job. The second is
      # fail-closed: when it fails the job stops here, and the browser suite
      # below never runs against a half-installed system.
      - id: playwright-deps
        continue-on-error: true
        timeout-minutes: 4
        run: pnpm --filter @dasher/web exec playwright install-deps chromium

      # `outcome`, not `conclusion`. `continue-on-error: true` rewrites
      # `conclusion` to `success`, so a condition written on `conclusion` would
      # never fire, the retry would be unreachable, and this would collapse
      # back to the single unbounded attempt it exists to replace — while
      # looking correct.
      # A timed-out step has its process tree killed, but the `apt-get` that
      # `install-deps` launched under sudo SURVIVES as an orphan, still holding
      # /var/lib/dpkg/lock-frontend. Observed live on 2026-08-19: the first
      # attempt hit its bound at 4m13s, and the retry died three seconds later
      # with "Could not get lock /var/lib/dpkg/lock-frontend. It is held by
      # process 3868 (apt-get)". A retry that cannot acquire the lock is not a
      # retry — it is a second failure wearing a retry's name, and without this
      # step the whole mechanism above is decorative in exactly the case it
      # exists for.
      #
      # Wait for the orphan to finish on its own first, since a mirror that is
      # merely slow will complete and release the lock. Only kill it when it
      # will not, and then repair whatever the kill left half-configured.
      - id: playwright-deps-clear
        name: Clear an interrupted apt run before retrying
        # `success() &&` is explicit rather than implied. A bare `if:` is
        # implicitly ANDed with `success()`, but relying on that here would make
        # the difference between "the retry is skipped because recovery failed"
        # and "the retry runs on a broken system" depend on a rule nobody can
        # see in the file.
        if: success() && steps.playwright-deps.outcome != 'success'
        timeout-minutes: 2
        run: |
          # Wait for an orphan to finish on its own: a merely slow mirror will
          # complete and release everything, and killing it would throw away a
          # working install. Detection is on the PROCESS, not on a lock probe.
          # An earlier version probed with `apt-get check`, which acquires
          # neither the dpkg frontend lock nor the lists lock, so it reported
          # "free" in three seconds while the orphan was still running and the
          # retry then died on /var/lib/apt/lists/lock. Testing a proxy for the
          # thing that fails is how a recovery step passes without recovering.
          waited=0
          while [ "$waited" -lt 60 ]; do
            if ! pgrep -x apt-get >/dev/null 2>&1 && ! pgrep -x dpkg >/dev/null 2>&1; then
              break
            fi
            waited=$((waited + 2))
            sleep 2
          done

          if pgrep -x apt-get >/dev/null 2>&1 || pgrep -x dpkg >/dev/null 2>&1; then
            echo "apt or dpkg still running after ${waited}s; terminating the orphan."
            # "no such process" is the expected result when the orphan exits
            # between the check and the kill, and is not a failure.
            sudo pkill -x apt-get || true
            sudo pkill -x dpkg || true
            sleep 3
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x dpkg || true
            sleep 2
          else
            echo "no orphaned apt or dpkg after ${waited}s."
          fi

          # NOT `|| true`. An unrepairable package database has to stop the job
          # here. Swallowing this would hand the retry an unusable system and
          # let the final annotation blame two install failures for what was
          # really a failed repair.
          sudo dpkg --configure -a

          # Postcondition over EVERY lock the installer needs, not one of them.
          # `flock` takes the same lock apt does, so this tests the thing that
          # actually failed rather than a proxy for it. Two different locks have
          # now broken the retry in two different runs, which is why this
          # enumerates them instead of trusting one.
          for lock in /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock \
                      /var/lib/apt/lists/lock /var/cache/apt/archives/lock; do
            if [ -e "$lock" ]; then
              sudo flock --timeout 15 "$lock" true
            fi
          done
          echo "every apt and dpkg lock is free."

      - id: playwright-deps-retry
        # Explicit `success()` again: when recovery fails this must not run.
        if: success() && steps.playwright-deps.outcome != 'success'
        timeout-minutes: 12
        run: |
          echo "First attempt: ${{ steps.playwright-deps.outcome }} within its 4-minute bound. Retrying once with a 12-minute bound."
          pnpm --filter @dasher/web exec playwright install-deps chromium

      # Both attempts are gone, so the job has already failed and nothing below
      # this runs. It exists so the failure names its own cause: without it the
      # only signal is a red step titled after a pnpm command, which reads as a
      # test failure and sends the next reader bisecting a diff that is not
      # involved.
      - name: Report a failed apt recovery as its own cause
        # A distinct cause deserves a distinct annotation. When recovery fails
        # the retry is skipped, so the two-attempt annotation below stays quiet
        # and this failure would otherwise be unnamed.
        if: failure() && steps.playwright-deps-clear.outcome == 'failure'
        run: |
          echo "::error title=Could not recover the package manager before retrying::The first 'playwright install-deps chromium' attempt hit its bound, and clearing the interrupted apt run afterwards failed: the dpkg lock could not be released, 'dpkg --configure -a' could not repair the package database, or the package manager was still unusable afterwards. The retry was deliberately skipped rather than run against a broken system. This is a runner/system-dependency failure before any product test ran; the diff under test is not implicated."

      - name: Report a system-dependency failure as its own cause
        if: failure() && steps.playwright-deps-retry.outcome == 'failure'
        run: |
          echo "::error title=Playwright system dependencies failed twice::Both bounded attempts at 'playwright install-deps chromium' failed or timed out (4 minutes, then 12, with a lock recovery between them). This is an apt/system-dependency failure that happened before any product test ran: it is not an E2E or persistence test failure, and the diff under test is not implicated. Both attempt logs are above."

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @dasher/web exec playwright install chromium

      - run: pnpm test:e2e

      # `pnpm audit --prod` is deliberately absent: the production dependency
      # set is a subset of the full set and the audit level is identical, so it
      # cannot fail unless the full audit above has already failed.
      - run: pnpm audit --audit-level high

      - run: "grep -qx 'Status: CLOSED' docs/security/GENERATED_CODE_GATE.md"

      - run: test -z "$(git status --porcelain)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DASHER_TEST_OWNER_DSN: postgresql://dasher_ci_owner:dasher_ci_owner_password@localhost:5432/dasher_ci
      DASHER_TEST_APP_DSN: postgresql://dasher_test_0123456789abcdef0123456789abcdef:dasher_ci_app_password@localhost:5432/dasher_ci
      DASHER_TEST_HMAC_KEY_B64URL: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    services:
      postgres:
        image: postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
        env:
          POSTGRES_DB: dasher_ci
          POSTGRES_PASSWORD: dasher_ci_owner_password
          POSTGRES_USER: dasher_ci_owner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=dasher_ci_owner --dbname=dasher_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @dasher/control-plane test:postgres

  # The persistence slice runs in its own job rather than inside `verify`, for
  # three reasons that are all about keeping evidence honest:
  #
  #   * schema-owner credentials stay out of the environment of the unit, build,
  #     and browser steps that do not need them;
  #   * `verify` keeps proving the app runs with NO database, including the
  #     five deliberate skips — that is a supported mode and it needs its own
  #     run;
  #   * "a saved dashboard survives a reload" becomes a nameable check that
  #     branch protection can require, instead of a few assertions inside a job
  #     named after something else.
  #
  # Service containers are job-local, so this binding 5432 does not collide with
  # the `postgres` job doing the same.
  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # The application credential is job-wide because the build and the test
      # run both need it. The OWNER credential is not: it is attached to the
      # single step that runs the browser suite, so checkout, install, build,
      # and browser installation never see it. Least privilege is worth little
      # if it is only argued for in a comment.
      DASHER_DATABASE_URL: postgresql://dasher_web_app:dasher_ci_app_password@localhost:5432/dasher_e2e
      DASHER_DEV_BOOTSTRAP: "1"
      # Explicit rather than relying on the default. CI must never depend on
      # an upstream being reachable or on what it happens to be reporting
      # today, and a run that silently went live would be nondeterministic in
      # a way that looks like flakiness.
      DASHER_SOURCE_MODE: fixture
    services:
      postgres:
        image: postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
        env:
          POSTGRES_DB: dasher_e2e
          POSTGRES_PASSWORD: dasher_ci_owner_password
          POSTGRES_USER: dasher_ci_owner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=dasher_ci_owner --dbname=dasher_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Preflight. Without it, a variable dropped from the job above turns the
      # persistence tests into skips and this job stays green while proving
      # nothing — the exact failure this job exists to prevent.
      - name: Require the persistence environment
        run: |
          for name in DASHER_DATABASE_URL DASHER_DEV_BOOTSTRAP; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is not set; the persistence tests would skip and this job would prove nothing"
              exit 1
            fi
          done

      # The migrator grants `dasher_app` to a login role but does not invent
      # one. Without this the app would connect as the owner and every
      # row-security assertion below would be meaningless.
      - name: Create the application login
        run: |
          PGPASSWORD=dasher_ci_owner_password psql -h localhost -U dasher_ci_owner -d dasher_e2e -v ON_ERROR_STOP=1 -c \
            "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='dasher_web_app') THEN CREATE ROLE dasher_web_app LOGIN PASSWORD 'dasher_ci_app_password'; END IF; END \$\$;"

      - run: pnpm --filter @dasher/control-plane migrate
        env:
          DASHER_MIGRATE_DSN: postgresql://dasher_ci_owner:dasher_ci_owner_password@localhost:5432/dasher_e2e
          DASHER_APP_LOGIN_ROLES: dasher_web_app

      - run: pnpm build

      - id: playwright-version
        run: |
          version="$(node -p "require('./apps/web/package.json').devDependencies['@playwright/test']")"
          echo "version=${version}" >>"$GITHUB_OUTPUT"

      - id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # Bounded and retried once, for the reason recorded above `verify`'s copy
      # of this step. Both jobs install the same system dependencies from the
      # same mirror, so both carry the same failure mode; on 2026-08-19 both
      # burned their full 30-minute budget on it.
      - id: playwright-deps
        continue-on-error: true
        timeout-minutes: 4
        run: pnpm --filter @dasher/web exec playwright install-deps chromium

      # `outcome`, not `conclusion`. `continue-on-error: true` rewrites
      # `conclusion` to `success`, so a condition written on `conclusion` would
      # never fire, the retry would be unreachable, and this would collapse
      # back to the single unbounded attempt it exists to replace — while
      # looking correct.
      # Same orphaned-lock recovery as `verify`, for the reason recorded there.
      - id: playwright-deps-clear
        name: Clear an interrupted apt run before retrying
        # `success() &&` is explicit rather than implied. A bare `if:` is
        # implicitly ANDed with `success()`, but relying on that here would make
        # the difference between "the retry is skipped because recovery failed"
        # and "the retry runs on a broken system" depend on a rule nobody can
        # see in the file.
        if: success() && steps.playwright-deps.outcome != 'success'
        timeout-minutes: 2
        run: |
          # Wait for an orphan to finish on its own: a merely slow mirror will
          # complete and release everything, and killing it would throw away a
          # working install. Detection is on the PROCESS, not on a lock probe.
          # An earlier version probed with `apt-get check`, which acquires
          # neither the dpkg frontend lock nor the lists lock, so it reported
          # "free" in three seconds while the orphan was still running and the
          # retry then died on /var/lib/apt/lists/lock. Testing a proxy for the
          # thing that fails is how a recovery step passes without recovering.
          waited=0
          while [ "$waited" -lt 60 ]; do
            if ! pgrep -x apt-get >/dev/null 2>&1 && ! pgrep -x dpkg >/dev/null 2>&1; then
              break
            fi
            waited=$((waited + 2))
            sleep 2
          done

          if pgrep -x apt-get >/dev/null 2>&1 || pgrep -x dpkg >/dev/null 2>&1; then
            echo "apt or dpkg still running after ${waited}s; terminating the orphan."
            # "no such process" is the expected result when the orphan exits
            # between the check and the kill, and is not a failure.
            sudo pkill -x apt-get || true
            sudo pkill -x dpkg || true
            sleep 3
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x dpkg || true
            sleep 2
          else
            echo "no orphaned apt or dpkg after ${waited}s."
          fi

          # NOT `|| true`. An unrepairable package database has to stop the job
          # here. Swallowing this would hand the retry an unusable system and
          # let the final annotation blame two install failures for what was
          # really a failed repair.
          sudo dpkg --configure -a

          # Postcondition over EVERY lock the installer needs, not one of them.
          # `flock` takes the same lock apt does, so this tests the thing that
          # actually failed rather than a proxy for it. Two different locks have
          # now broken the retry in two different runs, which is why this
          # enumerates them instead of trusting one.
          for lock in /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock \
                      /var/lib/apt/lists/lock /var/cache/apt/archives/lock; do
            if [ -e "$lock" ]; then
              sudo flock --timeout 15 "$lock" true
            fi
          done
          echo "every apt and dpkg lock is free."

      - id: playwright-deps-retry
        # Explicit `success()` again: when recovery fails this must not run.
        if: success() && steps.playwright-deps.outcome != 'success'
        timeout-minutes: 12
        run: |
          echo "First attempt: ${{ steps.playwright-deps.outcome }} within its 4-minute bound. Retrying once with a 12-minute bound."
          pnpm --filter @dasher/web exec playwright install-deps chromium

      # Both attempts are gone, so the job has already failed and nothing below
      # this runs. It exists so the failure names its own cause: without it the
      # only signal is a red step titled after a pnpm command, which reads as a
      # test failure and sends the next reader bisecting a diff that is not
      # involved.
      - name: Report a failed apt recovery as its own cause
        # A distinct cause deserves a distinct annotation. When recovery fails
        # the retry is skipped, so the two-attempt annotation below stays quiet
        # and this failure would otherwise be unnamed.
        if: failure() && steps.playwright-deps-clear.outcome == 'failure'
        run: |
          echo "::error title=Could not recover the package manager before retrying::The first 'playwright install-deps chromium' attempt hit its bound, and clearing the interrupted apt run afterwards failed: the dpkg lock could not be released, 'dpkg --configure -a' could not repair the package database, or the package manager was still unusable afterwards. The retry was deliberately skipped rather than run against a broken system. This is a runner/system-dependency failure before any product test ran; the diff under test is not implicated."

      - name: Report a system-dependency failure as its own cause
        if: failure() && steps.playwright-deps-retry.outcome == 'failure'
        run: |
          echo "::error title=Playwright system dependencies failed twice::Both bounded attempts at 'playwright install-deps chromium' failed or timed out (4 minutes, then 12, with a lock recovery between them). This is an apt/system-dependency failure that happened before any product test ran: it is not an E2E or persistence test failure, and the diff under test is not implicated. Both attempt logs are above."

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @dasher/web exec playwright install chromium

      # Named explicitly rather than run through `pnpm test:e2e`. Invoking the
      # whole suite and then grepping for skips passes just as happily if
      # `persisted-dashboard.spec.ts` is deleted, renamed, or stops being
      # discovered — the other nine specs go green and nothing says the subject
      # of this job never ran. Playwright fails when a named file does not
      # exist, which turns that into an error instead of a silence.
      - name: Run the persistence suite
        env:
          DASHER_DEV_SEED_DSN: postgresql://dasher_ci_owner:dasher_ci_owner_password@localhost:5432/dasher_e2e
          PLAYWRIGHT_JSON_OUTPUT_FILE: /tmp/persistence-results.json
        run: |
          pnpm --filter @dasher/web exec playwright test --forbid-only --reporter=json \
            e2e/persisted-dashboard.spec.ts

      # Positive proof, not absence of a symptom. The preflight catches a
      # missing variable and the explicit path catches a missing file; this
      # catches a guard that quietly turned the tests off in place.
      #
      # The check itself lives in `@dasher/repo-graph`, not in this file. It was
      # a hundred lines of Node inlined here, which nothing could lint,
      # typecheck, or run locally, and it pinned the test count at three
      # separate sites, so adding a seventh persistence test broke CI three
      # times over. `--min-tests` is a floor: the suite may grow freely, and a
      # suite that shrinks below it still fails.
      - name: Assert the persistence tests actually ran
        run: |
          pnpm --filter @dasher/repo-graph assert:playwright-report -- \
            --report=/tmp/persistence-results.json \
            --spec-file=persisted-dashboard.spec.ts \
            --min-tests=6

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: persistence-playwright-artifacts
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
