# One EC2 instance: a database, the application, and the only thing facing the
# internet.
#
# WHY POSTGRES IS HERE RATHER THAN RDS. The schema is not a set of tables with
# an application in front of it. It owns roles, `SECURITY DEFINER` functions in
# a `dasher_api` schema, forced row-level security, and a migrator that checks
# it owns the schema before it touches anything. All of that is easier to apply
# and to reason about against a database whose superuser is genuinely a
# superuser. Move to RDS when scheduled backups matter more than iteration
# speed; nothing in the application changes when it does, because the
# application only ever sees `DASHER_DATABASE_URL`.
#
# WHY THE APPLICATION PORT IS NOT PUBLISHED. Only the proxy binds a host port.
# The application is reachable on the compose network and nowhere else, so a
# security group mistake cannot expose it directly over plain HTTP — which
# matters because the session cookie is `__Host-` prefixed and `secure`, and a
# browser will simply not send it over an insecure origin.

name: dasher

services:
  postgres:
    image: postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DASHER_PG_SUPERUSER:?set in .env}
      POSTGRES_PASSWORD: ${DASHER_PG_SUPERUSER_PASSWORD:?set in .env}
      POSTGRES_DB: dasher
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published to the host. Nothing outside this compose file connects to
    # the database, including psql from the instance — use `docker compose exec`.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DASHER_PG_SUPERUSER} -d dasher"]
      interval: 5s
      timeout: 5s
      retries: 20

  # A one-shot, not a service. `docker compose run --rm migrate` applies the
  # baseline and exits; the migrator is idempotent and reports what it found
  # against what it applied, so running it on every deploy is the intended use
  # rather than a risk.
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The SCHEMA OWNER's connection, which exists only for this command. The
      # application never gets it: the app role cannot write `organizations`,
      # `users`, or `memberships`, and that restriction is the schema working.
      DASHER_MIGRATE_DSN: ${DASHER_MIGRATE_DSN:?set in .env}
      DASHER_APP_LOGIN_ROLES: dasher_web_app
    command: ["pnpm", "--filter", "@dasher/control-plane", "migrate"]

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DASHER_DATABASE_URL: ${DASHER_DATABASE_URL:?set in .env}
      DASHER_DEPLOYMENT_REVISION: ${DASHER_DEPLOYMENT_REVISION:?set in .env}
      # The planner is an explicit choice: fake, anthropic, or openrouter.
      # Credentials are provider-specific and there is no silent fallback.
      DASHER_PLANNER: ${DASHER_PLANNER:-fake}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DASHER_PLANNER_MODEL: ${DASHER_PLANNER_MODEL:-}
      DASHER_PLANNER_REASONING_EFFORT: ${DASHER_PLANNER_REASONING_EFFORT:-low}
      DASHER_PLANNER_DAILY_LIMIT: ${DASHER_PLANNER_DAILY_LIMIT:-500}
      # Sign-in. `--env-file` populates interpolation in THIS FILE; it does not
      # put anything into a container. Without these values named here the
      # application reads none of them, `mailer()` returns undefined, and every
      # visitor is told sign-in is unavailable — which is what this deployment
      # did until a review traced the runbook.
      DASHER_PUBLIC_ORIGIN: ${DASHER_PUBLIC_ORIGIN:?set in .env}
      DASHER_MAIL_TRANSPORT: ${DASHER_MAIL_TRANSPORT:-}
      DASHER_RESEND_API_KEY: ${DASHER_RESEND_API_KEY:-}
      DASHER_MAIL_FROM: ${DASHER_MAIL_FROM:-}
      # SES uses the instance role and this region; no mail key is injected.
      AWS_REGION: ${AWS_REGION:-}
      # DASHER_DEV_BOOTSTRAP and DASHER_DEV_SEED_DSN are absent on purpose and
      # must stay absent. See deploy/README.md — the first mints an
      # authenticated session for anyone who can reach the URL, and the second
      # is a schema-owner connection string.
    expose:
      - "3000"

  # Off the instance, on a timer. A dump beside the database is not a backup of
  # the failure that actually happens.
  backup:
    build:
      context: .
      dockerfile: backup.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The SCHEMA OWNER's connection: a dump has to read every row, which the
      # application role deliberately cannot.
      DASHER_BACKUP_DSN: ${DASHER_MIGRATE_DSN:?set in .env}
      DASHER_BACKUP_S3_URI: ${DASHER_BACKUP_S3_URI:?set in .env}
      DASHER_BACKUP_INTERVAL_SECONDS: ${DASHER_BACKUP_INTERVAL_SECONDS:-86400}
      # Prefer an instance role over keys. These are read if set, and left
      # unset when the instance profile provides credentials.
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      DASHER_PUBLIC_HOSTNAME: ${DASHER_PUBLIC_HOSTNAME:?set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  caddydata:
  caddyconfig:
